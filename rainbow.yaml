          example: admin@rainbowerp.com
        phone:
          type: string
          example: "+91 98765 43210"
        roles:
          type: array
          items:
            type: string
          example: ["admin", "super_admin"]
        is_guard:
          type: boolean
          example: true
        is_store_manager:
          type: boolean
          example: true
        permissions:
          type: array
          items:
            type: string
          example: ["orders.read", "locations.read", "gate.create"]
        assigned_locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    Location:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: FAC-MAIN
        name:
          type: string
          example: Central Manufacturing Plant
        type:
          type: string
          enum: [factory, warehouse]
          example: factory
        address:
          type: string
          example: Plot 42, Industrial Area Phase II, Silchar
        gstin:
          type: string
          example: 18AABCS1429B1Z5
        phone:
          type: string
          example: "+91 94350 11223"
